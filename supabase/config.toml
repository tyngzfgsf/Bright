# Local Supabase config (supabase start). Production settings live in the dashboard.
project_id = "bright"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 100

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "com.bright.app://login-callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[functions.chat]
verify_jwt = true

[functions.grade]
verify_jwt = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
